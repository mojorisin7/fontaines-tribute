<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>New website coming soon</title>
  <meta name="description" content="A tribute to Fontaines D.C. New website coming soon." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Inter:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    /* Same tokens as src/styles/global.css */
    :root {
      --bg: #000000;
      --fg: #fbfbf7;
      --muted: #8f8f8a;
      --accent: #1966cb;
      --font-display: 'Archivo', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
      --font-body: 'Inter', 'Helvetica Neue', Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-body);
      font-weight: 500;
      line-height: 1.6;
      display: grid;
      place-items: center;
      padding: 2rem 1rem;
      text-align: center;
    }
    main { max-width: 40rem; }
    .eyebrow, h1 {
      font-family: var(--font-display);
      font-stretch: 75%;
      font-weight: 900;
      text-transform: uppercase;
    }
    .eyebrow {
      display: inline-block;
      background: var(--accent);
      color: #000;
      letter-spacing: 0.25em;
      font-size: 0.85rem;
      padding: 0.35rem 0.9rem;
      margin: 0 0 1.5rem;
    }
    h1 {
      font-size: clamp(2.5rem, 11vw, 5.5rem);
      line-height: 0.95;
      letter-spacing: 0.04em;
      margin: 0 0 1.25rem;
    }
    p { margin: 0; color: var(--muted); font-size: 1.05rem; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">A tribute to Fontaines D.C.</p>
    <h1>New website coming soon</h1>
    <p>Live dates, music, videos and bookings. Check back shortly.</p>
  </main>
</body>
</html>
